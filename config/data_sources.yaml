  - id: gfs_0p25
    name: NOAA/NCEP Global Forecast System
    provider: NOAA/NCEP NOMADS
    dataset_version: GFS 0.25 degree operational archive
    temporal_coverage: operational archive; historical availability depends on NOMADS retention
    spatial_resolution: 0.25 degree
    temporal_resolution: 1-3 hourly forecast output
    role: raw NWP baseline and forecast-time predictor fields
    download_method: NOMADS GRIB2 filter with India bounding-box subsetting
    license_usage_note: NOAA public data; retain NOMADS attribution and file metadata
    citation: https://nomads.ncep.noaa.gov/cgi-bin/filter_gfs_0p25.pl
    historical_archive:
      ucar_dataset: https://gdex.k8s.ucar.edu/datasets/d084001/
      ucar_provider: NCAR GDEX THREDDS Data Server
      aws_registry: https://registry.opendata.aws/noaa-gfs-bdp-pds/
      aws_bucket: s3://noaa-gfs-bdp-pds
      aws_region: us-east-1
      aws_key_template: https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.{YYYYMMDD}/{CC}/atmos/gfs.t{CC}z.pgrb2.0p25.f{FFF}
      aws_index_template: https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.{YYYYMMDD}/{CC}/atmos/gfs.t{CC}z.pgrb2.0p25.f{FFF}.idx
      ucar_subset_endpoint: https://rda.ucar.edu/
      ucar_file_template: https://thredds.rda.ucar.edu/thredds/fileServer/files/g/d084001/{YYYY}/{YYYYMMDD}/gfs.0p25.{YYYYMMDD}{CC}.f{FFF}.grib2
      ucar_ncss_template: https://thredds.rda.ucar.edu/thredds/ncss/grid/files/g/d084001/{YYYY}/{YYYYMMDD}/gfs.0p25.{YYYYMMDD}{CC}.f{FFF}.grib2
      ucar_access_method: "THREDDS NCSS grid: preflight dataset.xml, request var/time/bbox/vertCoord, then save NetCDF subset"
      ucar_ncss_output_format: netcdf3
      ucar_request_policy: "one registered field per NCSS request; test case shows 2m temperature and relative humidity have incompatible vertical-level sets"
      ucar_subset_capabilities: [variables, geographic_domain, time]
      dry_run_forecast_hour: 24
      observed_aws_coverage: "June 2021 and June 2025 sample keys present; gfs.2020 prefix returned no objects on 2026-10-04"
      coverage_caveat: "Per-date and per-cycle completeness must be rechecked before retrieval; use UCAR GDEX for 2020 and variable/spatial subsets."
      verified_case:
        initialization: "2024-07-15T00:00:00Z"
        valid_time: "2024-07-16T00:00:00Z"
        lead_hours: 24
        bbox: {south: 8.0, north: 37.0, west: 68.0, east: 97.0}
        output: data/raw/gfs/test_subset/gfs_0p25_20240715_00_f024_india.nc
        manifest: data/raw/manifests/gfs_test_subset.json
        status: validated_single_case
      retrieval_timestamp: "2026-10-04T07:10:20.418979+00:00"
    local_cache_path: data/raw/gfs
    availability_status: single_historical_subset_verified; full_archive_not_ingested
    operational_features: true
    operational_access:
      access_method: "Open-Meteo Single Runs API, explicit GFS model selector and UTC run; upstream NOAA/NCEP GFS"
      api_endpoint: https://single-runs-api.open-meteo.com/v1/forecast
      model_selector: gfs_global
      forecast_mode: "00Z single run, +27h; hourly preceding-interval precipitation summed over the exact 24-hour target window"
      intermediary_attribution: "Open-Meteo API is the delivery service; NOAA/NCEP is the upstream model provider"
      validation_status: implemented; offline_api_smoke_tests_passed

