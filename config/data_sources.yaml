  - id: imd_rainfall_0p25
    name: IMD RF25 high-resolution daily gridded rainfall over India
    provider: India Meteorological Department, Climate Research and Services, Pune
    dataset_version: "Official RF25 long-period catalogue series 1901-2024; local annual NetCDF files 2020-2024. No semantic release ID is present in the files/catalogue."
    temporal_coverage: "Official catalogue 1901-2024; locally audited complete calendar years 2020-2024"
    spatial_resolution: 0.25 degree x 0.25 degree
    grid: "135 longitude x 129 latitude; 66.5-100.0E, 6.5-38.5N; 0.25 degree regular grid"
    rainfall_variable: RAINFALL
    rainfall_units: mm
    missing_value: -999.0
    temporal_resolution: "Daily; date D represents rainfall ending 08:30 IST / 03:00 UTC on D"
    accumulation_window_utc: "[D-1 03:00Z, D 03:00Z)"
    time_coordinate: "TIME has 00:00 date labels; local annual files do not include time bounds"
    calendar: "GREGORIAN explicitly encoded in 2024; not encoded in 2020-2023 files"
    local_format: NetCDF classic CDF-1
    provenance_note: "User-provided as provenance-verified; filenames/schema match the official IMD RF25 catalogue. Source retrieval URL/timestamp and semantic release identifier are not embedded in the files. Legacy imd_* episode NetCDFs remain unverified and are tracked separately."
    role: primary grid-matched verification target and reference rainfall analysis
    download_method: IMD Climate Research and Services official RF25 NetCDF archive
    license_usage_note: preserve IMD product/version metadata; do not call it perfect truth
    citation: https://imdpune.gov.in/cmpg/Griddata/Rainfall_25_NetCDF.html
    daily_observation_convention: https://api.imd.gov.in/public/api_reference.html
    methodology_reference: https://agupubs.onlinelibrary.wiley.com/doi/full/10.1029/2022EA002595
    retrieval_timestamp: null
    local_cache_path: data/raw/imd
    availability_status: local_RF25_annual_files_2020_2024_present
    operational_features: false

